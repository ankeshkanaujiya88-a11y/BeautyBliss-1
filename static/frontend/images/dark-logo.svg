<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 197 68" width="197" height="68">
  <defs>
    <linearGradient id="bbDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7347"/>
      <stop offset="100%" stop-color="#f55d2c"/>
    </linearGradient>
    <filter id="bbDarkShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#f55d2c" flood-opacity="0.4"/>
    </filter>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&amp;display=swap');
      .brand-title-dark {
        font-family: 'Poppins', 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        font-size: 22px;
        font-weight: 800;
      }
      .brand-subtitle-dark {
        font-family: 'Poppins', 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        font-size: 7.8px;
        font-weight: 700;
        letter-spacing: 2.5px;
        fill: #ff7e54;
      }
    </style>
  </defs>

  <!-- Left Icon Container -->
  <g filter="url(#bbDarkShadow)">
    <rect x="4" y="4" width="60" height="60" rx="14" ry="14" fill="url(#bbDarkGrad)"/>
  </g>

  <!-- Monogram & Sparkle inside Icon -->
  <g fill="#ffffff">
    <!-- Stylized B Stem -->
    <rect x="20" y="16" width="5.5" height="36" rx="2.75"/>
    <!-- Top Loop -->
    <path d="M22 16 H33 C38.5 16 42.5 19.5 42.5 25 C42.5 30.5 38.5 34 33 34 H22 Z M25.5 20.5 V29.5 H32.5 C35.8 29.5 37.8 27.6 37.8 25 C37.8 22.4 35.8 20.5 32.5 20.5 Z" fill-rule="evenodd"/>
    <!-- Bottom Loop -->
    <path d="M22 33 H35 C41 33 45.5 36.8 45.5 42.5 C45.5 48.2 41 52 35 52 H22 Z M25.5 37.5 V47.5 H34.5 C38.2 47.5 40.5 45.4 40.5 42.5 C40.5 39.6 38.2 37.5 34.5 37.5 Z" fill-rule="evenodd"/>
    <!-- Beauty Sparkle Accent -->
    <path d="M47 11 Q47 16 42 16 Q47 16 47 21 Q47 16 52 16 Q47 16 47 11 Z"/>
    <circle cx="50.5" cy="24" r="1.4" opacity="0.9"/>
  </g>

  <!-- Brand Typography -->
  <text x="73" y="37" class="brand-title-dark">
    <tspan fill="#ffffff">Beauty</tspan><tspan fill="#f55d2c">Bliss</tspan>
  </text>
  <text x="74" y="52" class="brand-subtitle-dark">BEAUTY &amp; WELLNESS</text>
</svg>