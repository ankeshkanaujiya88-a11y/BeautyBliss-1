{% extends 'base.html' %}
{% load static %}

{% block title %}All Categories | Beauty Bliss{% endblock %}

{% block content %}
    <div class="wrapper">
        <div class="bb-Breadcrumb">
            <div class="container">
                <div class="row">
                    <div class="col-md-12">
                        <nav aria-label="breadcrumb">
                            <ol class="breadcrumb">
                                <li class="breadcrumb-item"><a href="{% url 'core:home' %}"> Home </a></li>
                                <li class="breadcrumb-item active" aria-current="page"> Categories</li>
                            </ol>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
        <div class="all-product-grid">
            <div class="container">
                <div class="row">
                    <div class="col-lg-12">
                        <div class="product-top-dt">
                            <div class="product-left-title">
                                <h2 class="cat_name"> All Categories </h2>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="product-list-view">
                    <div class="row category-by-cat">
                        {% for category in categories %}
                            <div class="col-lg-3 col-md-6 mb-4">
                                <a href="{% url 'products:category' category.slug %}"
                                   class="single-cat-item bg-white p-3 d-block text-center rounded shadow-sm">
                                    <div class="icon mb-2">
                                        <img src="{% if category.image %}{{ category.image.url }}{% else %}{% static 'frontend/images/logo-1.svg' %}{% endif %}" alt="{{ category.name }}" style="max-height: 80px; object-fit: contain;">
                                    </div>
                                    <div class="text font-weight-bold text-dark"> {{ category.name }} </div>
                                </a>
                            </div>
                        {% empty %}
                            <div class="col-lg-12 col-md-12">
                                <div class="how-order-steps text-center py-5">
                                    <div class="how-order-icon mb-3">
                                        <i class="uil uil-shopping-basket" style="font-size: 48px; color: #f55d2c;"></i>
                                    </div>
                                    <h4> No Categories Available </h4>
                                </div>
                            </div>
                        {% endfor %}
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
